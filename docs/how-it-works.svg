<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 230" width="960" height="230" role="img" aria-label="How ojas works: the agent runs a command; before it runs, ojas wraps simple noisy commands; the command runs unchanged; after it runs, ojas shortens large output, keeping errors first; the agent reads the short version. The full output is kept in a local store and ojas get brings any part back.">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path class="arw" d="M0 0L10 5L0 10z"/></marker>
  </defs>
  <style>
    text{font-family:-apple-system,"Segoe UI",Helvetica,Arial,sans-serif}
    .bg{fill:#f6f4ef}.box{fill:#ffffff;stroke:#dcd6ca}.ours{fill:#fff0e3;stroke:#e0561c}.ink{fill:#141b25}.mut{fill:#5b6676}.acc{fill:#c94a14}.line{stroke:#8a97a8}.arw{fill:#8a97a8}.dash{stroke:#e0561c;fill:none}
    @media (prefers-color-scheme: dark){.bg{fill:#141b25}.box{fill:#1b2330;stroke:#2a3442}.ours{fill:#2b1b0e;stroke:#ffb23f}.ink{fill:#f5f0e6}.mut{fill:#8a97a8}.acc{fill:#ffb23f}.line{stroke:#667183}.arw{fill:#667183}.dash{stroke:#ffb23f}}
  </style>
  <rect class="bg" width="960" height="230" rx="14"/>
  <g font-size="12.5">
    <rect class="box" x="20" y="30" width="160" height="96" rx="10"/>
    <text class="ink" x="36" y="56" font-size="15" font-weight="700">Agent</text>
    <text class="mut" x="36" y="80">runs cargo test,</text>
    <text class="mut" x="36" y="97">a pipe, Grep or Read</text>

    <rect class="ours" x="208" y="30" width="160" height="96" rx="10"/>
    <text class="acc" x="224" y="56" font-size="15" font-weight="700">ojas · before</text>
    <text class="mut" x="224" y="80">wraps simple noisy</text>
    <text class="mut" x="224" y="97">commands, never</text>
    <text class="mut" x="224" y="114">changes arguments</text>

    <rect class="box" x="396" y="30" width="160" height="96" rx="10"/>
    <text class="ink" x="412" y="56" font-size="15" font-weight="700">Command runs</text>
    <text class="mut" x="412" y="80">exactly as written,</text>
    <text class="mut" x="412" y="97">same exit code</text>

    <rect class="ours" x="584" y="30" width="160" height="96" rx="10"/>
    <text class="acc" x="600" y="56" font-size="15" font-weight="700">ojas · after</text>
    <text class="mut" x="600" y="80">shortens big output,</text>
    <text class="mut" x="600" y="97">errors first, pipes</text>
    <text class="mut" x="600" y="114">and Grep included</text>

    <rect class="box" x="772" y="30" width="168" height="96" rx="10"/>
    <text class="ink" x="788" y="56" font-size="15" font-weight="700">Agent reads</text>
    <text class="mut" x="788" y="80">the short version</text>
    <text class="mut" x="788" y="97">plus a footer:</text>
    <text class="mut" x="788" y="114">how to get more</text>
  </g>
  <g class="line" stroke-width="2" marker-end="url(#a)">
    <line x1="182" y1="78" x2="204" y2="78"/>
    <line x1="370" y1="78" x2="392" y2="78"/>
    <line x1="558" y1="78" x2="580" y2="78"/>
    <line x1="746" y1="78" x2="768" y2="78"/>
  </g>
  <path class="dash" stroke-width="1.5" stroke-dasharray="5 4" d="M664 128 V166 H560"/>
  <rect class="ours" x="300" y="148" width="260" height="40" rx="8"/>
  <text class="ink" x="430" y="173" font-size="13" text-anchor="middle">Full output kept in a local store</text>
  <path class="dash" stroke-width="1.5" stroke-dasharray="5 4" d="M560 180 H856 V128"/>
  <text class="acc" x="708" y="200" font-size="12.5" font-weight="700" text-anchor="middle">ojas get &lt;id&gt;</text>
  <text class="mut" x="20" y="214" font-size="11.5">Plugs into Claude Code hooks: no proxy, no daemon, no network. Hooks add about 50 ms per command.</text>
</svg>

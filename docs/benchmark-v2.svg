<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 300" width="960" height="300" role="img" aria-label="ojas benchmark v2 highlights: 40 of 40 big-output tasks passed; 6.3x cheaper on a 20,000-line log; 10 of 10 test-suite failures found where no tool found 0 of 10; same cost as no tool on everyday tasks with 80 of 80 passed">
  <defs><linearGradient id="gl" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#e8890c"/><stop offset="1" stop-color="#d9480f"/></linearGradient><linearGradient id="gd" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffca4a"/><stop offset="1" stop-color="#ff6a2a"/></linearGradient></defs>
  <style>
    .bg{fill:#f6f4ef}.card{fill:#ffffff;stroke:#e3ded3}.big{fill:url(#gl)}.lab{fill:#141b25}.sub{fill:#5b6676}.head{fill:#141b25}.foot{fill:#5b6676}
    @media (prefers-color-scheme: dark){.bg{fill:#141b25}.card{fill:#1b2330;stroke:#2a3442}.big{fill:url(#gd)}.lab{fill:#f5f0e6}.sub{fill:#8a97a8}.head{fill:#f5f0e6}.foot{fill:#8a97a8}}
    text{font-family:-apple-system,"Segoe UI",Helvetica,Arial,sans-serif}
    .big{font-size:46px;font-weight:700}
    .lab{font-size:13.5px;font-weight:600}
    .sub{font-size:12.5px}
    .head{font-size:15px;font-weight:600}
    .foot{font-size:12px}
  </style>
  <rect class="bg" x="0" y="0" width="960" height="300" rx="14"/>
  <text class="head" x="24" y="36">ojas benchmark v2 · 720 runs · Claude Code in Docker · pre-registered · vs no tool, headroom, rtk</text>

  <rect class="card" x="24" y="56" width="216" height="196" rx="10"/>
  <text class="big" x="42" y="118">40/40</text>
  <text class="lab" x="42" y="148">big-output tasks passed</text>
  <text class="sub" x="42" y="180">no tool 28/40</text>
  <text class="sub" x="42" y="198">headroom 34/40</text>
  <text class="sub" x="42" y="216">rtk 26/40</text>

  <rect class="card" x="256" y="56" width="216" height="196" rx="10"/>
  <text class="big" x="274" y="118">6.3x</text>
  <text class="lab" x="274" y="148">cheaper on a 20k-line log</text>
  <text class="sub" x="274" y="180">$0.012 vs $0.073 per run</text>
  <text class="sub" x="274" y="198">2 turns instead of 4.6</text>
  <text class="sub" x="274" y="216">10/10 found the FATAL line</text>

  <rect class="card" x="488" y="56" width="216" height="196" rx="10"/>
  <text class="big" x="506" y="118">10/10</text>
  <text class="lab" x="506" y="148">test failures found</text>
  <text class="sub" x="506" y="180">express suite, run once</text>
  <text class="sub" x="506" y="198">no tool 0/10: Claude Code</text>
  <text class="sub" x="506" y="216">truncated the failure away</text>

  <rect class="card" x="720" y="56" width="216" height="196" rx="10"/>
  <text class="big" x="738" y="118">0.97x</text>
  <text class="lab" x="738" y="148">cost on everyday tasks</text>
  <text class="sub" x="738" y="180">no overhead from the hooks</text>
  <text class="sub" x="738" y="198">80/80 passed, 8 tasks × 10</text>
  <text class="sub" x="738" y="216">same as no tool [0.89, 1.06]</text>

  <text class="foot" x="24" y="282">Big-output tasks: 0.88x cost of no tool [0.79, 0.97], 17% fewer turns. Large files in v0.3: 0.93x [0.76, 1.11].</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 280" width="960" height="280" role="img" aria-label="ojas: cut the noise your coding agent reads, keep every error. Example: grep output shrinks from 1,779 lines to 154, about 93.7k tokens to 2.8k.">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f2a13b"/>
      <stop offset="1" stop-color="#d9480f"/>
    </linearGradient>
  </defs>
  <style>
    text{font-family:-apple-system,"Segoe UI",Helvetica,Arial,sans-serif}
    .mono text{font-family:ui-monospace,"SF Mono",Consolas,"Liberation Mono",monospace}
    .bg{fill:#0f1720}.tag{fill:#e6edf3}.sub{fill:#9fb0c2}.pill{fill:#1c2733;stroke:#2c3a48}.pilltx{fill:#d6e2ee}
    .term{fill:#080c11;stroke:#2c3a48}.t{fill:#c9d6e3}.d{fill:#6f8399}.h{fill:#f2a13b}
  </style>
  <rect class="bg" width="960" height="280" rx="16"/>

  <text x="40" y="104" font-size="78" font-weight="800" fill="url(#g)" letter-spacing="-2">ojas</text>
  <text class="tag" x="42" y="146" font-size="21" font-weight="600">Cut the noise your coding agent reads.</text>
  <text class="tag" x="42" y="176" font-size="21" font-weight="600">Keep every error.</text>
  <text class="sub" x="42" y="208" font-size="14.5">One 2 MB Rust binary · no proxy · no daemon · no telemetry</text>

  <rect class="pill" x="42" y="226" width="120" height="28" rx="14"/>
  <text class="pilltx" x="102" y="245" font-size="13" text-anchor="middle">Claude Code</text>
  <rect class="pill" x="170" y="226" width="96" height="28" rx="14"/>
  <text class="pilltx" x="218" y="245" font-size="13" text-anchor="middle">Cursor</text>
  <rect class="pill" x="274" y="226" width="96" height="28" rx="14"/>
  <text class="pilltx" x="322" y="245" font-size="13" text-anchor="middle">Codex</text>
  <rect class="pill" x="378" y="226" width="96" height="28" rx="14"/>
  <text class="pilltx" x="426" y="245" font-size="13" text-anchor="middle">Copilot</text>

  <rect class="term" x="520" y="40" width="404" height="200" rx="10"/>
  <circle cx="540" cy="58" r="5" fill="#ff5f57"/><circle cx="556" cy="58" r="5" fill="#febc2e"/><circle cx="572" cy="58" r="5" fill="#28c840"/>
  <g class="mono" font-size="12.5" xml:space="preserve">
    <text class="d" x="538" y="90">$ <tspan class="t">grep -rn "def " headroom/proxy</tspan></text>
    <text class="t" x="538" y="112">1779 matches in 133 files</text>
    <text class="t" x="538" y="132">headroom/proxy/audit.py (3)</text>
    <text class="t" x="538" y="152">  27: def is_auditable_path(...)</text>
    <text class="t" x="538" y="172">  32: def _client_ip(...)</text>
    <text class="d" x="538" y="192">… +1589 more matches in 110 files</text>
    <text class="h" x="538" y="218">[ojas: 1779 lines → 154,</text>
    <text class="h" x="538" y="234"> ≈93.7k → ≈2.8k tokens]</text>
  </g>
</svg>
